; 修真靶场自定义 PHP 配置
; 教学场景需要开启一些在生产环境会被禁用的功能

; 错误显示（教学环境开启，便于观察错误回显漏洞）
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; 日志记录
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log

; 上传配置（允许上传可执行文件以演示文件上传漏洞）
file_uploads = On
upload_max_filesize = 10M
post_max_size = 10M
max_file_uploads = 20

; 危险函数：教学环境**保留**所有函数（关卡中可能用到）
; 生产环境应禁用：exec, system, passthru, shell_exec, popen, proc_open, eval
disable_functions =

; URL 包含（用于演示远程文件包含漏洞）
allow_url_include = On
allow_url_fopen = On

; Session 配置
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.save_path = "/var/www/html/storage/sessions"

; OPcache（生产建议开启，教学环境关闭以避免 opcode 缓存干扰）
opcache.enable = 0

; 内存/执行
memory_limit = 256M
max_execution_time = 60

; 字符集
default_charset = "UTF-8"
mbstring.internal_encoding = "UTF-8"

; 时区
date.timezone = "Asia/Shanghai"